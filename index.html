<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OI Monitor Pro - Веб-панель</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Стили остаются такими же как в вашем файле, только обновим JavaScript */
    </style>
</head>
<body>
    <!-- HTML остается таким же, только обновляем JavaScript -->

    <script>
        // Глобальные переменные
        let currentUser = null;
        let currentSettings = {
            oi_threshold: 5,
            volume_threshold: 20,
            comparison_period: '1h',
            pair_filter: 'all',
            monitoring_active: true
        };

        const periods = {
            '1m': '1 минута',
            '5m': '5 минут', 
            '15m': '15 минут',
            '30m': '30 минут',
            '1h': '1 час',
            '2h': '2 часа',
            '4h': '4 часа',
            '1d': '1 день'
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', async function() {
            await initializeApp();
        });

        // Основная функция инициализации
        async function initializeApp() {
            try {
                // Получаем данные из Telegram WebApp
                await initializeTelegramUser();
                
                // Загружаем настройки пользователя
                await loadUserSettings();
                
                // Обновляем данные бота
                await loadBotStats();
                
                // Показываем интерфейс
                showApp();
                
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                showError('Ошибка загрузки приложения');
            }
        }

        // Инициализация пользователя из Telegram
        async function initializeTelegramUser() {
            // Проверяем, что мы в Telegram WebApp
            if (typeof window.Telegram === 'undefined' || !Telegram.WebApp) {
                showError('Пожалуйста, откройте эту страницу через Telegram бота');
                return;
            }
            
            const tg = Telegram.WebApp;
            
            // Настраиваем интерфейс
            tg.expand();
            tg.setHeaderColor('#667eea');
            tg.setBackgroundColor('#667eea');
            
            // Получаем данные пользователя
            const user = tg.initDataUnsafe.user;
            
            if (user) {
                currentUser = {
                    id: user.id,
                    first_name: user.first_name || '',
                    last_name: user.last_name || '',
                    username: user.username || '',
                    photo_url: user.photo_url || null,
                    isTelegram: true
                };
                
                updateUserDisplay();
                showNotification('👋 Добро пожаловать, ' + user.first_name + '!', 'success');
                
            } else {
                showError('Не удалось получить данные пользователя');
            }
        }

        // Обновление отображения пользователя
        function updateUserDisplay() {
            if (!currentUser) return;
            
            document.getElementById('userName').textContent = 
                currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : '');
            
            document.getElementById('userId').textContent = currentUser.id;
            
            // Обновляем аватар
            const avatarEl = document.getElementById('userAvatar');
            if (currentUser.photo_url) {
                avatarEl.innerHTML = `<img src="${currentUser.photo_url}" alt="Avatar">`;
            } else {
                avatarEl.innerHTML = `<i class="fas fa-user"></i>`;
            }
        }

        // Загрузка настроек пользователя с сервера
        async function loadUserSettings() {
            if (!currentUser) {
                showNotification('❌ Не удалось загрузить данные пользователя', 'error');
                return;
            }
            
            try {
                showNotification('🔄 Загрузка настроек...');
                
                const response = await fetch(`http://localhost:5000/api/user/${currentUser.id}`);
                
                if (!response.ok) {
                    throw new Error('API недоступен');
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Обновляем настройки
                    const settings = data.settings;
                    currentSettings = {
                        oi_threshold: settings.oi_threshold || 5,
                        volume_threshold: settings.volume_threshold || 20,
                        comparison_period: settings.comparison_period || '1h',
                        pair_filter: settings.pair_filter || 'all',
                        monitoring_active: settings.monitoring_active !== false
                    };
                    
                    // Обновляем статистику
                    if (data.user) {
                        document.getElementById('signalsCount').textContent = 
                            settings.total_signals || 0;
                    }
                    
                    updateSettingsDisplay();
                    showNotification('✅ Настройки загружены', 'success');
                    
                } else {
                    showNotification('❌ Пользователь не найден', 'error');
                }
                
            } catch (error) {
                console.error('Ошибка загрузки настроек:', error);
                showNotification('❌ Ошибка загрузки настроек', 'error');
            }
        }

        // Загрузка статистики бота
        async function loadBotStats() {
            try {
                const response = await fetch('http://localhost:5000/api/bot-stats');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('activePairs').textContent = data.active_pairs || 0;
                }
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }

        // Обновление отображения настроек
        function updateSettingsDisplay() {
            // Пороги
            document.getElementById('oiValue').textContent = currentSettings.oi_threshold + '%';
            document.getElementById('volumeValue').textContent = currentSettings.volume_threshold + '%';
            
            // Период
            document.getElementById('periodValue').textContent = 
                periods[currentSettings.comparison_period] || '1 час';
            
            // Слайдеры
            const oiSlider = document.querySelector('#oiSetting input[type="range"]');
            const volSlider = document.querySelector('#volumeSetting input[type="range"]');
            
            if (oiSlider) oiSlider.value = currentSettings.oi_threshold;
            if (volSlider) volSlider.value = currentSettings.volume_threshold;
            
            document.getElementById('oiSliderValue').textContent = currentSettings.oi_threshold + '%';
            document.getElementById('volumeSliderValue').textContent = currentSettings.volume_threshold + '%';
            
            // Активные периоды
            updateActivePeriods();
        }

        // Обновление активных периодов
        function updateActivePeriods() {
            document.querySelectorAll('.period-option').forEach(option => {
                option.classList.remove('active');
                const period = option.getAttribute('onclick').match(/'([^']+)'/)[1];
                if (period === currentSettings.comparison_period) {
                    option.classList.add('active');
                }
            });
        }

        // Переключение настроек
        function toggleSetting(settingId) {
            const setting = document.getElementById(settingId);
            const allSettings = document.querySelectorAll('.setting-control');
            
            allSettings.forEach(s => {
                if (s.id !== settingId) {
                    s.classList.remove('active');
                }
            });
            
            setting.classList.toggle('active');
        }

        // Обновление слайдеров
        function updateSlider(type, value) {
            if (type === 'oi') {
                currentSettings.oi_threshold = parseInt(value);
                document.getElementById('oiSliderValue').textContent = value + '%';
            } else if (type === 'volume') {
                currentSettings.volume_threshold = parseInt(value);
                document.getElementById('volumeSliderValue').textContent = value + '%';
            }
        }

        // Выбор периода
        function selectPeriod(period) {
            currentSettings.comparison_period = period;
            updateActivePeriods();
            updateSettingsDisplay();
        }

        // Применение настроек
        async function applySettings() {
            if (!currentUser) {
                showNotification('❌ Сначала загрузите данные пользователя', 'error');
                return;
            }
            
            try {
                showNotification('🔄 Сохранение настроек...');
                
                // Отправляем настройки на сервер
                const response = await fetch(`http://localhost:5000/api/user/${currentUser.id}/settings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(currentSettings)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showNotification('✅ Настройки успешно сохранены!', 'success');
                    
                    // Отправляем данные в Telegram бота через WebApp
                    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.sendData) {
                        Telegram.WebApp.sendData(JSON.stringify({
                            action: 'settings_updated',
                            user_id: currentUser.id,
                            settings: currentSettings
                        }));
                    }
                    
                } else {
                    showNotification('❌ Ошибка сохранения: ' + result.message, 'error');
                }
                
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                showNotification('❌ Ошибка соединения с сервером', 'error');
            }
            
            // Закрываем все настройки
            document.querySelectorAll('.setting-control').forEach(s => {
                s.classList.remove('active');
            });
        }

        // Загрузка данных пользователя
        async function loadUserData() {
            showNotification('🔄 Обновление данных...');
            await loadUserSettings();
            await loadBotStats();
        }

        // Проверка связи
        async function testConnection() {
            try {
                const response = await fetch('http://localhost:5000/api/health');
                if (response.ok) {
                    showNotification('✅ Связь с ботом установлена', 'success');
                } else {
                    showNotification('❌ Сервер недоступен', 'error');
                }
            } catch (error) {
                showNotification('❌ Ошибка соединения', 'error');
            }
        }

        // Показать приложение
        function showApp() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        // Показать ошибку
        function showError(message) {
            document.getElementById('loader').innerHTML = `
                <div style="color: #ef4444; font-size: 24px; margin-bottom: 10px;">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div style="color: #1f2937; text-align: center; max-width: 300px;">
                    <div style="font-weight: 600; margin-bottom: 10px; font-size: 18px;">Ошибка</div>
                    <div style="font-size: 14px; margin-bottom: 20px;">${message}</div>
                    <button onclick="location.reload()" style="
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        color: white;
                        border: none;
                        padding: 12px 24px;
                        border-radius: 12px;
                        font-weight: 600;
                        cursor: pointer;
                        width: 100%;
                    ">
                        <i class="fas fa-redo"></i> Повторить
                    </button>
                </div>
            `;
        }

        // Показать уведомление
        function showNotification(message, type = '') {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notificationText');
            const icon = notification.querySelector('i');
            
            notification.className = 'notification';
            if (type) notification.classList.add(type);
            
            // Устанавливаем иконку в зависимости от типа
            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
                icon.style.color = '#10b981';
            } else if (type === 'error') {
                icon.className = 'fas fa-exclamation-circle';
                icon.style.color = '#ef4444';
            } else {
                icon.className = 'fas fa-info-circle';
                icon.style.color = '#667eea';
            }
            
            text.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
