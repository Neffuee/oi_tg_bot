<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debug Bot Settings</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 20px;
            background: #2ecc71;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            margin-top: 20px;
        }
        input { margin: 10px 0; width: 100%; padding: 10px; box-sizing: border-box;}
        .log { color: yellow; font-size: 12px; text-align: left; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>🛠 Debug Mode</h2>
    
    <label>Тест OI (%):</label>
    <input type="number" id="oi" value="5">

    <label>Тест Volume (%):</label>
    <input type="number" id="vol" value="20">

    <button id="btn" onclick="saveData()">🚀 ОТПРАВИТЬ ДАННЫЕ</button>

    <div id="log" class="log">Логи будут здесь...</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function log(text) {
            document.getElementById('log').innerHTML += "<br>> " + text;
        }

        // Проверка инициализации
        log("WebApp Version: " + tg.version);
        log("Platform: " + tg.platform);

        function saveData() {
            try {
                // 1. Проверяем кнопку
                alert("1. Кнопка нажата! Начинаем сбор данных...");
                log("Click registered");

                // 2. Собираем данные
                let oiVal = document.getElementById('oi').value;
                let volVal = document.getElementById('vol').value;

                let data = {
                    active: true,
                    oi: parseFloat(oiVal),
                    vol: parseFloat(volVal),
                    period: "1h",
                    filter: "all",
                    custom: ""
                };

                let jsonString = JSON.stringify(data);
                alert("2. Данные собраны: " + jsonString);
                log("Data prepared: " + jsonString);

                // 3. Пытаемся отправить
                if (tg.sendData) {
                    alert("3. Отправляю tg.sendData()...");
                    tg.sendData(jsonString);
                    log("sendData called");
                    
                    // 4. Закрываем
                    setTimeout(function(){
                         tg.close();
                    }, 500); 
                } else {
                    alert("❌ ОШИБКА: tg.sendData не найдена! Вы открыли сайт не через кнопку бота?");
                }

            } catch (e) {
                alert("❌ КРИТИЧЕСКАЯ ОШИБКА JS: " + e.message);
                log("Error: " + e.message);
            }
        }
    </script>
</body>
</html>
