<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройки Бота</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .checkbox-group input {
            width: 20px;
            height: 20px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .debug-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            display: none;
        }
        
        .debug-toggle {
            text-align: center;
            margin-top: 15px;
        }
        
        .debug-toggle button {
            background: none;
            border: none;
            color: #667eea;
            text-decoration: underline;
            font-size: 14px;
            padding: 5px;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Настройки бота</h1>
        <p class="subtitle">Настройте параметры отслеживания Open Interest</p>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="active" checked>
                <label for="active">Активный мониторинг</label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="oi">Порог Open Interest (%)</label>
            <input type="number" id="oi" min="0.1" max="100" step="0.1" value="5.0">
        </div>
        
        <div class="form-group">
            <label for="vol">Порог Volume (%)</label>
            <input type="number" id="vol" min="0.1" max="100" step="0.1" value="20.0">
        </div>
        
        <div class="form-group">
            <label for="period">Период сравнения</label>
            <select id="period">
                <option value="1m">1 минута</option>
                <option value="5m">5 минут</option>
                <option value="15m">15 минут</option>
                <option value="30m">30 минут</option>
                <option value="1h" selected>1 час</option>
                <option value="4h">4 часа</option>
                <option value="1d">1 день</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="filter">Фильтр пар</label>
            <select id="filter">
                <option value="all" selected>Все пары</option>
                <option value="top50">Топ-50</option>
                <option value="custom">Custom</option>
            </select>
        </div>
        
        <div class="form-group" id="customGroup" style="display: none;">
            <label for="custom">Custom пары (через запятую)</label>
            <input type="text" id="custom" placeholder="BTCUSDT, ETHUSDT, SOLUSDT">
        </div>
        
        <div class="button-group">
            <button class="btn-secondary" onclick="loadFromURL()">Загрузить</button>
            <button class="btn-primary" onclick="sendData()">Сохранить</button>
        </div>
        
        <div class="debug-toggle">
            <button onclick="toggleDebug()">Показать отладку</button>
        </div>
        
        <div id="debugInfo" class="debug-info">
            <h4>Отладочная информация:</h4>
            <div id="debugLog"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Развернуть на весь экран
        tg.expand();
        tg.enableClosingConfirmation();
        
        // Элементы DOM
        const statusDiv = document.getElementById('status');
        const debugInfo = document.getElementById('debugInfo');
        const debugLog = document.getElementById('debugLog');
        const filterSelect = document.getElementById('filter');
        const customGroup = document.getElementById('customGroup');
        
        // Логирование
        function log(message) {
            const time = new Date().toLocaleTimeString();
            debugLog.innerHTML += `[${time}] ${message}<br>`;
            console.log(message);
        }
        
        // Показать статус
        function showStatus(message, type = 'success') {
            statusDiv.textContent = message;
            statusDiv.className = `status status-${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }
        
        // Показать/скрыть отладку
        function toggleDebug() {
            debugInfo.style.display = debugInfo.style.display === 'block' ? 'none' : 'block';
        }
        
        // Загрузить настройки из URL
        function loadFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            
            const active = urlParams.get('active') === 'true';
            const oi = urlParams.get('oi') || '5.0';
            const vol = urlParams.get('vol') || '20.0';
            const period = urlParams.get('period') || '1h';
            const filter = urlParams.get('filter') || 'all';
            const custom = urlParams.get('custom') || '';
            
            document.getElementById('active').checked = active;
            document.getElementById('oi').value = oi;
            document.getElementById('vol').value = vol;
            document.getElementById('period').value = period;
            document.getElementById('filter').value = filter;
            document.getElementById('custom').value = custom;
            
            updateCustomGroup();
            
            log('Настройки загружены из URL');
            showStatus('Настройки загружены', 'success');
        }
        
        // Обновить видимость поля custom
        function updateCustomGroup() {
            if (filterSelect.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        }
        
        // Отправить данные в бот
        function sendData() {
            try {
                log('Начинаем отправку данных...');
                
                // Собираем данные
                const data = {
                    active: document.getElementById('active').checked,
                    oi: parseFloat(document.getElementById('oi').value),
                    vol: parseFloat(document.getElementById('vol').value),
                    period: document.getElementById('period').value,
                    filter: document.getElementById('filter').value,
                    custom: document.getElementById('custom').value.trim()
                };
                
                // Проверяем данные
                if (isNaN(data.oi) || data.oi <= 0) {
                    showStatus('Ошибка: неверный порог OI', 'error');
                    return;
                }
                
                if (isNaN(data.vol) || data.vol <= 0) {
                    showStatus('Ошибка: неверный порог Volume', 'error');
                    return;
                }
                
                log(`Данные подготовлены: ${JSON.stringify(data)}`);
                
                // Отправляем данные через Telegram Web App
                if (tg.sendData) {
                    log('Вызываем tg.sendData()...');
                    
                    // Показываем пользователю, что идет отправка
                    showStatus('Отправка данных...', 'success');
                    
                    // Отправляем данные
                    tg.sendData(JSON.stringify(data));
                    
                    log('Данные отправлены через tg.sendData()');
                    
                    // Закрываем WebApp через 1 секунду
                    setTimeout(() => {
                        tg.close();
                    }, 1000);
                    
                } else {
                    log('❌ tg.sendData не доступен!');
                    showStatus('Ошибка: WebApp не инициализирован', 'error');
                    
                    // Альтернативный способ: отправляем как обычное сообщение
                    log('Пытаемся альтернативный способ...');
                    
                    // Создаем сообщение с данными
                    const message = JSON.stringify(data);
                    log(`Альтернативные данные: ${message}`);
                    
                    showStatus('Используется альтернативный метод', 'success');
                    
                    // Даем инструкции пользователю
                    showStatus('Скопируйте эти данные и отправьте боту:\n' + message, 'success');
                }
                
            } catch (error) {
                log(`❌ Ошибка: ${error.message}`);
                showStatus(`Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Слушатель изменения фильтра
        filterSelect.addEventListener('change', updateCustomGroup);
        
        // Автозагрузка при открытии
        window.addEventListener('load', () => {
            log('WebApp загружен');
            log(`Платформа: ${tg.platform}`);
            log(`Версия: ${tg.version}`);
            log(`Инициализация: ${tg.initData ? 'Да' : 'Нет'}`);
            
            // Загружаем настройки из URL
            loadFromURL();
            
            // Проверяем доступность sendData
            if (!tg.sendData) {
                log('⚠️ ВНИМАНИЕ: tg.sendData не доступен!');
                showStatus('Внимание: открыто не в Telegram', 'error');
            }
        });
        
        // Тестовая функция для отладки
