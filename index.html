<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Настройки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { padding: 20px; font-family: Arial; }
        .container { max-width: 400px; margin: 0 auto; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Настройки</h2>
        
        <label>
            <input type="checkbox" id="active" checked>
            Активный мониторинг
        </label>
        
        <input type="number" id="oi" value="5.0" placeholder="Порог OI (%)">
        <input type="number" id="vol" value="20.0" placeholder="Порог Volume (%)">
        
        <select id="period">
            <option value="1h">1 час</option>
            <option value="1m">1 минута</option>
            <option value="5m">5 минут</option>
        </select>
        
        <select id="filter">
            <option value="all">Все пары</option>
            <option value="top50">Топ-50</option>
        </select>
        
        <button onclick="sendSettings()">💾 Сохранить</button>
        
        <div id="status" style="margin-top: 20px; padding: 10px; display: none;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Получаем token из URL или используем ваш
        const BOT_TOKEN = '7915524418:AAEIB_bvb2R87iI7eBLVW_PrFxclZ3stfY0';
        
        function showStatus(msg, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.style.display = 'block';
            status.style.background = type === 'success' ? '#d4edda' : '#f8d7da';
            status.style.color = type === 'success' ? '#155724' : '#721c24';
            setTimeout(() => status.style.display = 'none', 3000);
        }
        
        function sendSettings() {
            const data = {
                active: document.getElementById('active').checked,
                oi: parseFloat(document.getElementById('oi').value),
                vol: parseFloat(document.getElementById('vol').value),
                period: document.getElementById('period').value,
                filter: document.getElementById('filter').value,
                custom: ""
            };
            
            console.log('Данные:', data);
            
            const dataString = JSON.stringify(data);
            
            // Способ 1: Через sendData (может не работать)
            if (tg.sendData) {
                try {
                    tg.sendData(dataString);
                    console.log('Отправлено через tg.sendData');
                } catch(e) {
                    console.log('Ошибка sendData:', e);
                }
            }
            
            // Способ 2: Как текстовое сообщение (РАБОТАЕТ!)
            const message = `⚙️ НАСТРОЙКИ: ${dataString}`;
            
            // Отправляем через Bot API
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: tg.initDataUnsafe.user.id,
                    text: message
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.ok) {
                    console.log('✅ Сообщение отправлено!');
                    showStatus('✅ Настройки сохранены!');
                    setTimeout(() => tg.close(), 1000);
                } else {
                    console.log('Ошибка API:', result);
                    showStatus('Ошибка отправки', 'error');
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                showStatus('Сетевая ошибка', 'error');
            });
        }
        
        // Загружаем настройки из URL
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('oi')) {
                document.getElementById('oi').value = params.get('oi');
                document.getElementById('vol').value = params.get('vol') || '20.0';
            }
        };
    </script>
</body>
</html>
