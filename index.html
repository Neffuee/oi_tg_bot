<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки бота</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .status {
            padding: 12px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .debug {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Настройки бота</h1>
        
        <div id="status" class="status"></div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="active" checked>
            <label for="active">✅ Активный мониторинг</label>
        </div>
        
        <div class="form-group">
            <label for="oi">Порог OI (%)</label>
            <input type="number" id="oi" value="5.0" step="0.1" min="0.1">
        </div>
        
        <div class="form-group">
            <label for="vol">Порог Volume (%)</label>
            <input type="number" id="vol" value="20.0" step="0.1" min="0.1">
        </div>
        
        <div class="form-group">
            <label for="period">Период сравнения</label>
            <select id="period">
                <option value="1h">1 час</option>
                <option value="1m">1 минута</option>
                <option value="5m">5 минут</option>
                <option value="15m">15 минут</option>
                <option value="30m">30 минут</option>
                <option value="4h">4 часа</option>
                <option value="1d">1 день</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="filter">Фильтр пар</label>
            <select id="filter">
                <option value="all">Все пары</option>
                <option value="top50">Топ-50</option>
                <option value="custom">Custom</option>
            </select>
        </div>
        
        <div class="form-group" id="customGroup" style="display: none;">
            <label for="custom">Custom пары (через запятую)</label>
            <input type="text" id="custom" placeholder="BTCUSDT, ETHUSDT">
        </div>
        
        <button onclick="saveSettings()">💾 Сохранить настройки</button>
        
        <div class="debug">
            <strong>Отладка:</strong>
            <div id="debug"></div>
        </div>
    </div>

    <script>
        // Загружаем настройки из URL
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('active').checked = params.get('active') === 'true';
            document.getElementById('oi').value = params.get('oi') || '5.0';
            document.getElementById('vol').value = params.get('vol') || '20.0';
            document.getElementById('period').value = params.get('period') || '1h';
            document.getElementById('filter').value = params.get('filter') || 'all';
            document.getElementById('custom').value = params.get('custom') || '';
            
            // Показываем/скрываем поле custom
            document.getElementById('customGroup').style.display = 
                document.getElementById('filter').value === 'custom' ? 'block' : 'none';
        }
        
        // Показываем статус
        function showStatus(message, type = 'success') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }
        
        // Отладочное сообщение
        function debugLog(message) {
            const debugDiv = document.getElementById('debug');
            const time = new Date().toLocaleTimeString();
            debugDiv.innerHTML += `[${time}] ${message}<br>`;
            console.log(message);
        }
        
        // Сохраняем настройки
        async function saveSettings() {
            try {
                // Собираем данные
                const settings = {
                    active: document.getElementById('active').checked,
                    oi: parseFloat(document.getElementById('oi').value),
                    vol: parseFloat(document.getElementById('vol').value),
                    period: document.getElementById('period').value,
                    filter: document.getElementById('filter').value,
                    custom: document.getElementById('custom').value.trim()
                };
                
                debugLog(`Собраны настройки: ${JSON.stringify(settings)}`);
                
                // Проверяем данные
                if (isNaN(settings.oi) || settings.oi <= 0) {
                    showStatus('Ошибка: неверный порог OI', 'error');
                    return;
                }
                
                if (isNaN(settings.vol) || settings.vol <= 0) {
                    showStatus('Ошибка: неверный порог Volume', 'error');
                    return;
                }
                
                showStatus('📤 Отправка настроек...', 'success');
                
                // Ваш Chat ID (замените на свой)
                const CHAT_ID = '903170561';
                // Ваш Bot Token
                const BOT_TOKEN = '7915524418:AAEIB_bvb2R87iI7eBLVW_PrFxclZ3stfY0';
                
                // Отправляем как команду /settings в чат
                const message = `/settings ${JSON.stringify(settings)}`;
                
                debugLog(`Отправляем сообщение: ${message}`);
                
                // Отправляем через Telegram Bot API
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    debugLog('✅ Сообщение успешно отправлено!');
                    showStatus('✅ Настройки сохранены!', 'success');
                    
                    // Закрываем WebApp если открыто в Telegram
                    if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
                        setTimeout(() => {
                            window.Telegram.WebApp.close();
                        }, 1500);
                    }
                } else {
                    debugLog(`❌ Ошибка Telegram API: ${JSON.stringify(result)}`);
                    showStatus(`Ошибка: ${result.description}`, 'error');
                }
                
            } catch (error) {
                debugLog(`❌ Ошибка: ${error.message}`);
                showStatus(`Ошибка сети: ${error.message}`, 'error');
            }
        }
        
        // При загрузке страницы
        window.addEventListener('load', () => {
            debugLog('Страница настроек загружена');
            loadFromURL();
            
            // Обработчик изменения фильтра
            document.getElementById('filter').addEventListener('change', function() {
                document.getElementById('customGroup').style.display = 
                    this.value === 'custom' ? 'block' : 'none';
            });
            
            // Проверяем, открыто ли в Telegram
            if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
                debugLog('Открыто в Telegram WebApp');
                window.Telegram.WebApp.expand();
            } else {
                debugLog('Открыто в браузере');
            }
        });
    </script>
</body>
</html>
